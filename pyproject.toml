[project]
name = "telegram-casino-bot"
version = "0.1.4"
description = "Casino bot"
authors = [
    { name="Kanashii" }
]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram~=3.4.1",
    "aiogram-i18n~=1.3.4",
    "alembic~=1.13.1",
    "asyncpg~=0.29.0",
    "fluent-runtime~=0.4.0",
    "pydantic-settings~=2.2.1",
    "sqlalchemy~=2.0.29",
    "redis~=5.0.3",
    "cachetools~=5.3.3",
]

[project.urls]
Repository = "https://github.com/Th3Kanashii/telegram-virtual-casino-bot"

[tool.uv]
dev-dependencies = [
    "mypy>=1.14.1",
    "ruff>=0.8.6",
]

[tool.black]
line-length = 99
exclude = "\\.?venv|\\.?tests"

[tool.ruff]
target-version = "py38"
line-length = 99
lint.select = [
    "C",
    "DTZ",
    "E",
    "F",
    "I",
    "ICN",
    "N",
    "PLC",
    "PLE",
    "Q",
    "T",
    "W",
    "YTT",
]
lint.ignore = ["N805"]
exclude = [
    ".venv",
    ".idea",
]
[tool.mypy]
plugins = [
    "sqlalchemy.ext.mypy.plugin",
    "pydantic.mypy"
]
exclude = [
    "venv",
    ".venv",
    ".idea",
    ".tests",
]
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["bot.handlers.*"]
strict_optional = false
warn_return_any = false
disable_error_code = ["union-attr"]
